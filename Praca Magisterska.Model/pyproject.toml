[project]
name = "model-ziola"
version = "0.1.0"
description = "Rozpoznawanie zanieczyszczeń suszu (Czyste / Krzyżowe / Organiczne)"
requires-python = ">=3.14"
dependencies = [
    "tensorflow==2.22.0rc0",
    "numpy==2.5.4",
    "scikit-learn==1.9.1",
    "pillow==13.0.0",
]

[build-system]
